name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing; cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Scanner pinning is deliberately split. Trivy and Syft float on `latest`, because a
# vulnerability scanner should fail us on findings published after this file was written
# — so this pipeline can legitimately go red without any change of ours. gitleaks is
# pinned, because the gate self-test asserts what it detects, and a scanner that silently
# changes its detections would make that test flaky. Bumping it is a deliberate edit.
env:
  NODE_VERSION: '24'
  GITLEAKS_VERSION: '8.30.1'

jobs:
  commits:
    name: Commit format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Conventional Commits
        run: >
          uvx --from commitizen cz check
          --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.sha }}

  extractors:
    name: Extractor SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --directory extractors --all-groups --all-extras --locked
      - name: Lint
        run: |
          uv run --directory extractors ruff check .
          uv run --directory extractors ruff format --check .
      - name: Types
        run: uv run --directory extractors pyright
      # Fast and hermetic: the loop against a scripted core. The loop against a *real* core
      # is in the core suite, where the reference extractor is the end-to-end double.
      - name: Tests
        run: uv run --directory extractors pytest

  server:
    name: Core service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The extractor SDK is a path dependency of the core's *dev* group: one test runs the
      # real three-sided arrangement (API, worker, extractor) rather than a mock of the
      # plugin boundary, so the lockfile resolves it from the working tree.
      - name: Install
        run: uv sync --directory server --all-groups --locked
      - name: Lint
        run: |
          uv run --directory server ruff check .
          uv run --directory server ruff format --check .
      - name: Types
        run: uv run --directory server pyright
      # Integration tests start a real PostgreSQL via testcontainers; migrations are
      # exercised up *and* down there, and the coverage floor is enforced by pytest.
      - name: Tests
        run: uv run --directory server pytest --cov --fr-report=../traceability-report.json
      # The matrix is built once, in its own job, from every layer's report — this one
      # only hands its own over (11-engineering-standards.md § requirement traceability).
      - uses: actions/upload-artifact@v4
        with:
          name: requirement-report-core
          path: traceability-report.json

  docs:
    name: Specification and corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --directory server --all-groups --locked
      # Structural rules only — ids, methods, cross-references, index agreement. Vague
      # wording warns, because a human must choose the number that replaces the word.
      - name: Specification documents
        run: uv run --directory server python -m tools.spec_lint
      - name: Corpus manifest
        run: uv run --directory server python -m tools.corpus
      # Generators must be reproducible and the notice current, or the manifest stops
      # being evidence of anything (ADR-0015).
      - name: Corpus is reproducible and its attribution current
        run: |
          make corpus
          git diff --exit-code -- corpus \
            || { echo '::error::corpus fixtures or attribution are stale. Run: make corpus'; exit 1; }

  web:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: |
          pnpm run lint
          pnpm run format:check
      - name: Types
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test
      - name: Build
        run: pnpm run build
      - name: Install browser
        run: pnpm --filter @store-everything/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter @store-everything/web run e2e
      - name: Component showcase builds
        run: pnpm --filter @store-everything/web run build-storybook
      - uses: actions/upload-artifact@v4
        with:
          name: requirement-report-web
          path: |
            traceability-report.web.json
            traceability-report.e2e.json

  # `Implemented` is computed here, never claimed in a feature file, and it is computed
  # from *every* suite: a requirement only a browser can verify reaches the same gate as
  # one the core suite proves (Q59). Needing both jobs is the point — a matrix built from
  # a partial run would report a covered requirement as uncovered.
  traceability:
    name: Requirement traceability
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --directory server --all-groups --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: requirement-report-*
          merge-multiple: true
      - name: Build the matrix
        run: |
          uv run --directory server python -m tools.traceability \
            --report ../traceability-report.json \
            --report ../traceability-report.web.json \
            --report ../traceability-report.e2e.json \
            --output ../traceability-matrix.md
      # A CI artefact on purpose: a generated file in the repository goes stale.
      - uses: actions/upload-artifact@v4
        with:
          name: traceability-matrix
          path: traceability-matrix.md

  contract:
    name: Contract and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: |
          uv sync --directory server --all-groups --locked
          pnpm install --frozen-lockfile
      # The schema and the client are committed, so a change to either must arrive with
      # the change that causes it (08-api-principles.md).
      - name: Contract and generated client are current
        run: |
          make openapi
          git diff --exit-code -- openapi.json openapi-extractor.json \
            packages/api-client/src/generated \
            || { echo '::error::A contract document or the generated client is stale. Run: make openapi'; exit 1; }
      - name: Dependency licences
        run: uv run --directory server python -m tools.check_licenses
      - name: Third-party notice generates
        run: uv run --directory server python -m tools.check_licenses --notice ../THIRD-PARTY-LICENSES.md
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.md

  gates:
    name: Gate self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: |
          uv sync --directory server --all-groups --locked
          pnpm install --frozen-lockfile
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      # Every gate must reject a deliberately violating sample, or it is decoration.
      # REQUIRE_ALL_GATES turns "tool not installed" from a skip into a failure: in CI a
      # gate that quietly vanishes is the very thing this job exists to catch.
      - name: Gates reject violating samples
        env:
          REQUIRE_ALL_GATES: '1'
        run: ./tools/verify-gates.sh

  sandbox:
    name: Extractor sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The privacy promise — an extractor reaches the API and nothing else — is a property of
      # the compose topology, not of any code in this repository, so the only honest place to
      # check it is inside a running container (ADR-0021). The script has a positive control:
      # an extractor that could reach *nothing* would pass a naive isolation test.
      - name: The sandbox holds
        run: ./tools/sandbox-check.sh
      - name: Engine version, for the record
        if: always()
        run: docker version --format 'engine {{.Server.Version}}'

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Secret scan
        run: gitleaks dir . --no-banner --redact
      - name: Python dependency vulnerabilities
        run: |
          uv export --directory server --no-dev --no-emit-project --no-hashes --no-annotate \
            --format requirements-txt > /tmp/prod-requirements.txt
          uvx pip-audit --requirement /tmp/prod-requirements.txt
      - name: JavaScript dependency vulnerabilities
        run: pnpm audit --prod --audit-level moderate

  image:
    name: Image build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The whole repository is the context, not `server/`: this image carries the built web
      # client as well as the service, because one image and one origin is what makes the session
      # cookie same-site by construction (10 § topology, F-027/FR-1).
      - name: Build
        run: docker build -f server/Dockerfile -t store-everything-core:ci .
      # The extractors' image, held to the same baseline (05 § container requirements): every
      # official extractor runs from it, so a regression here would be inherited by all of them.
      - name: Build the extractors image
        run: docker build -f extractors/Dockerfile -t store-everything-extractors:ci extractors
      # The virtualenv is built at image-build time, so a package installer in the
      # runtime is unnecessary — and a liability: pip carries its own vendored
      # dependency tree, which is where this image's only CVEs came from.
      - name: Runtimes carry no package installer
        run: |
          for image in store-everything-core:ci store-everything-extractors:ci; do
            if docker run --rm --entrypoint sh "$image" \
                -c 'command -v pip || command -v pip3'; then
              echo "::error::pip is present in $image"
              exit 1
            fi
          done
      - name: Extractor images run unprivileged
        run: |
          if [ "$(docker run --rm --entrypoint id store-everything-extractors:ci -u)" = "0" ]; then
            echo '::error::the extractors image runs as root'
            exit 1
          fi
      # The image must carry its analysis tooling, not discover at 3am that it does not: an
      # extractor that cannot import libvips claims jobs and fails every one of them.
      - name: The extractors image carries its imaging stack
        run: |
          docker run --rm --entrypoint python store-everything-extractors:ci -c \
            'import pyvips, pypdfium2; print(pyvips.version(0), pyvips.version(1))'
      # The core ships none of its development dependencies. Asserted rather than assumed
      # because the extractor SDK is one of them — a path dependency of the dev group, so that
      # one test can drive the real plugin boundary — and an image that shipped it would be
      # carrying a client of its own API around for no reason.
      - name: The core image ships no development dependency
        run: |
          if docker run --rm --entrypoint python store-everything-core:ci -c \
              'import importlib.util, sys; sys.exit(0 if importlib.util.find_spec("se_extractor") else 1)'; then
            echo '::error::the core image contains the extractor SDK, which is dev-only'
            exit 1
          fi
      # And it still starts: `--frozen` installs the lockfile's pins without re-resolving them
      # (see server/Dockerfile), so the thing worth checking is that what it installed runs.
      - name: The core image imports its own application
        run: docker run --rm --entrypoint python store-everything-core:ci -c 'import store_everything'
      # Publishing happens from tags only (11-engineering-standards.md § versioning).
      - name: Vulnerability scan
        run: |
          for image in store-everything-core:ci store-everything-extractors:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --exit-code 1 --severity HIGH,CRITICAL \
              --ignore-unfixed --no-progress "$image"
          done
      - name: Software bill of materials
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            anchore/syft:latest store-everything-core:ci -o spdx-json > sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
