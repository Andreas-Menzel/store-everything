# Alembic CLI configuration.
#
# The database URL is deliberately absent: it is resolved from the environment
# (`SE_DATABASE_URL`) by `migrations/env.py`, so a password never lands in a committed
# file and ConfigParser interpolation can never mangle it.

[alembic]
script_location = src/store_everything/migrations
prepend_sys_path = src
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
