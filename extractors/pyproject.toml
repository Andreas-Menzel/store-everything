[project]
name = "store-everything-extractors"
version = "0.2.0"
description = "Store Everything — extractor SDK, reference extractor and conformance kit"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "AGPL-3.0-only"
# One runtime dependency, deliberately: an extractor image should be mostly its own analysis
# tooling, and every dependency here is one a third-party author inherits from us.
dependencies = ["httpx>=0.28"]

# What an *official* extractor in this repository needs, as an extra rather than a dependency —
# for exactly the reason above. A third-party author gets the SDK and none of our imaging stack;
# the `preview-gen` image asks for it by name (`uv sync --extra preview`).
#
# `pyvips[binary]` bundles libvips as a wheel (LGPL-2.1+, used unmodified through its own
# binding) so neither the image nor a developer's machine needs a system package; `pypdfium2`
# is PDFium (BSD-3-Clause) the same way. Both licences are recorded in the SBOM like every
# other dependency (ADR-0016).
[project.optional-dependencies]
preview = ["pypdfium2>=5.0.0", "pyvips[binary]>=3.0.0"]
documents = [
    "charset-normalizer>=3.4",
    "lingua-language-detector>=2.1",
    "pymupdf>=1.26",
]

[project.scripts]
se-reference-extractor = "se_extractor.reference:main"
se-preview-gen = "se_extractor.preview_gen:main"
se-pdf-pages = "se_extractor.pdf_pages:main"
se-basic-metadata = "se_extractor.basic_metadata:main"
se-pdf-text = "se_extractor.pdf_text:main"
se-text-plain = "se_extractor.text_plain:main"
se-tesseract-ocr = "se_extractor.tesseract_ocr:main"
se-conformance = "se_extractor.conformance:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/se_extractor"]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14", "pyright>=1.1.400"]

# ---------------------------------------------------------------- lint / format
# The same gates as the core, because this is the code third-party authors read as the
# example: it has to look like the standard it is held to (11 § engineering standards).

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Markdown stays hand-formatted, as everywhere else in this repository (`.prettierignore` says
# the same, for the same reason): ruff would reflow the Python examples in README.md and bury
# real changes in whitespace. The examples are written to be read, not to be formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtin shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "S",         # bandit
    "RUF",       # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------- type checking

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
# The same relaxations as the core, for the same reason: a JSON document from the wire is `Any`
# however carefully it is read afterwards, and this package's whole job is reading them
# tolerantly. Every other strict rule stays on.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false

# ---------------------------------------------------------------- tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
