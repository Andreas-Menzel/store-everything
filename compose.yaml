# Production deployment (ADR-0005, ADR-0009, 10-deployment-and-operations.md).
#
# Only the API joins the external Traefik network; PostgreSQL stays internal with no
# ingress. TLS, HSTS and the HTTP→HTTPS redirect belong to Traefik — this stack serves
# plain HTTP on the internal network only.
#
#   docker compose up -d                      # start
#   docker compose run --rm migrations        # apply schema migrations
#
# For a development machine without a proxy, add the override:
#   docker compose -f compose.yaml -f compose.dev.yaml up -d

name: store-everything

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # PostgreSQL 18 nests its data directory so that `pg_upgrade --link` works; the
      # pre-18 path (/var/lib/postgresql/data) makes the container refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP on purpose: during initdb the server accepts only the unix socket, so a
      # socket probe reports ready while connections from the API would still be refused.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [internal]

  api:
    image: ${IMAGE:-ghcr.io/andreas-menzel/store-everything-core:latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SE_APP_ENV: production
      SE_LOG_LEVEL: ${SE_LOG_LEVEL:-INFO}
      SE_HOST: 0.0.0.0
      SE_API_DOCS_ENABLED: ${SE_API_DOCS_ENABLED:-true}
      # The built web client, baked into this image and served at its own origin
      # (F-027/FR-1). Configurable so a bind-mounted build can replace it.
      SE_WEB_ROOT: ${SE_WEB_ROOT:-/srv/store-everything-web}
      SE_CORS_ALLOW_ORIGINS: ${SE_CORS_ALLOW_ORIGINS:-}
      # Only the proxy's address on the shared network is trusted; a spoofed client IP
      # would poison rate limiting and the audit trail (ADR-0009).
      SE_FORWARDED_ALLOW_IPS: ${SE_FORWARDED_ALLOW_IPS:-}
      # Identity (07-identity-permissions-sharing.md). The bootstrap pair creates the first
      # administrator on an instance that has no accounts, and is ignored afterwards.
      SE_BOOTSTRAP_ADMIN_EMAIL: ${SE_BOOTSTRAP_ADMIN_EMAIL:-}
      SE_BOOTSTRAP_ADMIN_PASSWORD: ${SE_BOOTSTRAP_ADMIN_PASSWORD:-}
      SE_SESSION_IDLE_EXPIRY_DAYS: ${SE_SESSION_IDLE_EXPIRY_DAYS:-14}
      SE_SESSION_COOKIE_SECURE: ${SE_SESSION_COOKIE_SECURE:-true}
      SE_LOGIN_MAX_ATTEMPTS: ${SE_LOGIN_MAX_ATTEMPTS:-10}
      SE_LOGIN_LOCKOUT_MINUTES: ${SE_LOGIN_LOCKOUT_MINUTES:-15}
      SE_RATE_LIMIT_PER_MINUTE: ${SE_RATE_LIMIT_PER_MINUTE:-300}
      # Operation layer (12-reliability.md § tuning defaults). The API enqueues work in the
      # request's transaction; the orchestrator claims and runs it.
      SE_LEASE_SECONDS: ${SE_LEASE_SECONDS:-300}
      SE_HEARTBEAT_SECONDS: ${SE_HEARTBEAT_SECONDS:-60}
      SE_MAX_ATTEMPTS: ${SE_MAX_ATTEMPTS:-4}
      SE_RETRY_BASE_SECONDS: ${SE_RETRY_BASE_SECONDS:-10}
      SE_RETRY_MAX_SECONDS: ${SE_RETRY_MAX_SECONDS:-3600}
      SE_WORKER_CONCURRENCY: ${SE_WORKER_CONCURRENCY:-4}
      SE_WORKER_POLL_SECONDS: ${SE_WORKER_POLL_SECONDS:-5}
      # App-owned storage (03 § storage layout): `versions/` holds the only copy of every
      # superseded version, `derived/` is regenerable. Both live on the app-data volume.
      SE_APP_DATA_ROOT: ${SE_APP_DATA_ROOT:-/var/lib/store-everything}
      SE_JANITOR_GRACE_HOURS: ${SE_JANITOR_GRACE_HOURS:-24}
      SE_JANITOR_INTERVAL_MINUTES: ${SE_JANITOR_INTERVAL_MINUTES:-60}
      # The user's own file trees (03 § storage layout). Managed workspace roots are created
      # under SE_DATA_ROOT; adoption of an existing directory is confined to the allow-list
      # and is empty — disabled — until an operator names a path they have mounted here.
      SE_DATA_ROOT: ${SE_DATA_ROOT:-/srv/store-everything}
      SE_ADOPTION_ROOTS: ${SE_ADOPTION_ROOTS:-}
      SE_WORKSPACE_SCAN_INTERVAL_MINUTES: ${SE_WORKSPACE_SCAN_INTERVAL_MINUTES:-60}
      # The watcher is the fast path in front of that schedule: it only ever hastens a scan
      # the schedule would have run anyway, so losing it costs latency and nothing else.
      SE_WATCHER_ENABLED: ${SE_WATCHER_ENABLED:-true}
      SE_WATCHER_DEBOUNCE_SECONDS: ${SE_WATCHER_DEBOUNCE_SECONDS:-5}
      # Uploads (ADR-0017). The append sizes are published to clients in `Upload-Limit`, so
      # they have to fit inside whatever the proxy in front of this will pass through.
      SE_UPLOAD_EXPIRY_DAYS: ${SE_UPLOAD_EXPIRY_DAYS:-7}
      SE_UPLOAD_MAX_SIZE: ${SE_UPLOAD_MAX_SIZE:-0}
      SE_UPLOAD_MAX_APPEND_SIZE: ${SE_UPLOAD_MAX_APPEND_SIZE:-67108864}
      SE_UPLOAD_MIN_APPEND_SIZE: ${SE_UPLOAD_MIN_APPEND_SIZE:-1048576}
    volumes:
      - ${APP_DATA:-app-data}:/var/lib/store-everything
      - ${WORKSPACE_DATA:-workspace-data}:/srv/store-everything
    healthcheck:
      # Readiness, not liveness: an instance whose migrations are pending must not be
      # sent traffic (10-deployment-and-operations.md § health & readiness).
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    # Sized for checkpoint-and-release, never for job duration: a graceful stop only
    # releases leases so a successor resumes at once (ADR-0010).
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The only service on all three: the proxy's network for people, the internal one for the
    # database, and the extractors' — which is the *only* thing an extractor can reach
    # (ADR-0021). An extractor on that network has no route to postgres, to Traefik, or out.
    networks: [internal, edge, extractors]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}
      traefik.http.routers.store-everything.rule: Host(`${PUBLIC_HOST:?set PUBLIC_HOST in .env}`)
      traefik.http.routers.store-everything.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.store-everything.tls: 'true'
      traefik.http.routers.store-everything.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.services.store-everything.loadbalancer.server.port: '8000'

  # Background work: uploads finalising, scans, the janitor, and from phase 2 the extractor
  # jobs. A separate process from the API on purpose — search and browsing must never wait
  # behind a queue (04 § prioritization) — and safe to stop at any instant: leases expire and
  # another worker reclaims (ADR-0010).
  orchestrator:
    image: ${IMAGE:-ghcr.io/andreas-menzel/store-everything-core:latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SE_APP_ENV: production
      SE_LOG_LEVEL: ${SE_LOG_LEVEL:-INFO}
      SE_LEASE_SECONDS: ${SE_LEASE_SECONDS:-300}
      SE_HEARTBEAT_SECONDS: ${SE_HEARTBEAT_SECONDS:-60}
      SE_MAX_ATTEMPTS: ${SE_MAX_ATTEMPTS:-4}
      SE_RETRY_BASE_SECONDS: ${SE_RETRY_BASE_SECONDS:-10}
      SE_RETRY_MAX_SECONDS: ${SE_RETRY_MAX_SECONDS:-3600}
      SE_WORKER_CONCURRENCY: ${SE_WORKER_CONCURRENCY:-4}
      SE_WORKER_POLL_SECONDS: ${SE_WORKER_POLL_SECONDS:-5}
      # App-owned storage (03 § storage layout): `versions/` holds the only copy of every
      # superseded version, `derived/` is regenerable. Both live on the app-data volume.
      SE_APP_DATA_ROOT: ${SE_APP_DATA_ROOT:-/var/lib/store-everything}
      SE_JANITOR_GRACE_HOURS: ${SE_JANITOR_GRACE_HOURS:-24}
      SE_JANITOR_INTERVAL_MINUTES: ${SE_JANITOR_INTERVAL_MINUTES:-60}
      # The user's own file trees (03 § storage layout). Managed workspace roots are created
      # under SE_DATA_ROOT; adoption of an existing directory is confined to the allow-list
      # and is empty — disabled — until an operator names a path they have mounted here.
      SE_DATA_ROOT: ${SE_DATA_ROOT:-/srv/store-everything}
      SE_ADOPTION_ROOTS: ${SE_ADOPTION_ROOTS:-}
      SE_WORKSPACE_SCAN_INTERVAL_MINUTES: ${SE_WORKSPACE_SCAN_INTERVAL_MINUTES:-60}
      # The watcher is the fast path in front of that schedule: it only ever hastens a scan
      # the schedule would have run anyway, so losing it costs latency and nothing else.
      SE_WATCHER_ENABLED: ${SE_WATCHER_ENABLED:-true}
      SE_WATCHER_DEBOUNCE_SECONDS: ${SE_WATCHER_DEBOUNCE_SECONDS:-5}
      # Uploads (ADR-0017). The append sizes are published to clients in `Upload-Limit`, so
      # they have to fit inside whatever the proxy in front of this will pass through.
      SE_UPLOAD_EXPIRY_DAYS: ${SE_UPLOAD_EXPIRY_DAYS:-7}
      SE_UPLOAD_MAX_SIZE: ${SE_UPLOAD_MAX_SIZE:-0}
      SE_UPLOAD_MAX_APPEND_SIZE: ${SE_UPLOAD_MAX_APPEND_SIZE:-67108864}
      SE_UPLOAD_MIN_APPEND_SIZE: ${SE_UPLOAD_MIN_APPEND_SIZE:-1048576}
    volumes:
      - ${APP_DATA:-app-data}:/var/lib/store-everything
      - ${WORKSPACE_DATA:-workspace-data}:/srv/store-everything
    command: ['store-everything', 'worker']
    # Sized for stop-claiming-and-release, never for job duration (ADR-0010).
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # No ingress and no proxy label: nothing routes to a worker.
    networks: [internal]

  # Never starts on its own: when migrations run on upgrade is still open (Q20), so
  # applying them stays an explicit act.
  #   docker compose run --rm migrations
  migrations:
    image: ${IMAGE:-ghcr.io/andreas-menzel/store-everything-core:latest}
    build:
      context: .
      dockerfile: server/Dockerfile
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SE_APP_ENV: production
    command: ['alembic', 'upgrade', 'head']
    restart: 'no'
    networks: [internal]

  # The first official extractor: thumbnails, placeholders and image previews for every file
  # that has a visual source (09-previews.md, F-028). It is here rather than in an overlay
  # because a file browser without thumbnails looks broken, so this is part of the default
  # stack — but it still needs an identity and a credential before it can do anything:
  #
  #     POST /api/v1/extractors  {"id": "preview-gen"}   → SE_PREVIEW_GEN_TOKEN in `.env`
  #
  # Everything below the network line is the hardening baseline from
  # `compose.extractor-example.yaml`, which is the template every extractor service copies.
  preview-gen:
    image: ${EXTRACTORS_IMAGE:-ghcr.io/andreas-menzel/store-everything-extractors:latest}
    build:
      context: ./extractors
      dockerfile: Dockerfile
    command: ['se-preview-gen']
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SE_CORE_URL: http://api:8000
      SE_EXTRACTOR_TOKEN: ${SE_PREVIEW_GEN_TOKEN:?mint one with POST /api/v1/extractors}
      SE_LOG_LEVEL: ${SE_LOG_LEVEL:-INFO}
      # One long poll rather than sixty short ones: an idle extractor should be quiet.
      SE_CLAIM_WAIT_SECONDS: '30'
      # libvips would otherwise size its cache and thread pool to the *host*, not to this
      # container's limits — the usual way an image resizer becomes the reason a small server
      # starts swapping.
      VIPS_CONCURRENCY: ${PREVIEW_GEN_CONCURRENCY:-2}

    # No egress, no database, no proxy: this network has no gateway, and PostgreSQL is not on
    # it. An extractor's whole world is the extractor API (ADR-0021).
    networks: [extractors]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${EXTRACTOR_TMPFS_SIZE:-512m}
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${PREVIEW_GEN_MEMORY:-1g}
    cpus: ${PREVIEW_GEN_CPUS:-2}
    stop_grace_period: 10s

  # Page images for documents: the eager first page beside every thumbnail, and any other page
  # when somebody asks for it (09-previews.md, F-028/FR-7). Its own service rather than part of
  # `preview-gen` because the policies differ — this one answers requests, and a request has
  # somebody waiting for it.
  pdf-pages:
    image: ${EXTRACTORS_IMAGE:-ghcr.io/andreas-menzel/store-everything-extractors:latest}
    build:
      context: ./extractors
      dockerfile: Dockerfile
    command: ['se-pdf-pages']
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SE_CORE_URL: http://api:8000
      SE_EXTRACTOR_TOKEN: ${SE_PDF_PAGES_TOKEN:?mint one with POST /api/v1/extractors}
      SE_LOG_LEVEL: ${SE_LOG_LEVEL:-INFO}
      # Shorter than the others: this extractor exists to answer requests, so an idle poll that
      # takes a while to notice new work is felt directly.
      SE_CLAIM_WAIT_SECONDS: '10'
      VIPS_CONCURRENCY: ${PDF_PAGES_CONCURRENCY:-2}

    networks: [extractors]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${EXTRACTOR_TMPFS_SIZE:-512m}
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${PDF_PAGES_MEMORY:-1g}
    cpus: ${PDF_PAGES_CPUS:-2}
    stop_grace_period: 10s

  # What every file says about itself: when a photo was taken, where, with what; what a document
  # calls itself (02 § MetadataEntry). Header reads only — it never decodes a pixel — which is why
  # it can accept every file cheaply.
  basic-metadata:
    image: ${EXTRACTORS_IMAGE:-ghcr.io/andreas-menzel/store-everything-extractors:latest}
    build:
      context: ./extractors
      dockerfile: Dockerfile
    command: ['se-basic-metadata']
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SE_CORE_URL: http://api:8000
      SE_EXTRACTOR_TOKEN: ${SE_BASIC_METADATA_TOKEN:?mint one with POST /api/v1/extractors}
      SE_LOG_LEVEL: ${SE_LOG_LEVEL:-INFO}
      SE_CLAIM_WAIT_SECONDS: '30'

    networks: [extractors]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=${EXTRACTOR_TMPFS_SIZE:-512m}
    user: '10001:10001'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    # Lower than the renderers on purpose: reading a header is not resizing an image.
    mem_limit: ${BASIC_METADATA_MEMORY:-512m}
    cpus: ${BASIC_METADATA_CPUS:-1}
    stop_grace_period: 10s

# Other extractors are ordinary services on the `extractors` network, shaped exactly like the ones
# above — see `compose.extractor-example.yaml` for the annotated template and docs/install.md for
# how to install one. The rest of the official set arrives over phase 2.

volumes:
  # Deliberately not switchable to a host path: PostgreSQL refuses a data directory whose
  # ownership and mode it does not like, and a bind mount is the usual way to discover that.
  # Its backup path is `pg_dump` or a snapshot, not a directory someone browses.
  postgres-data:
  # The default for `APP_DATA`. `versions/` inside it is the only copy of superseded file
  # content, so it is mandatory backup scope — unlike `derived/`, which reprocessing can rebuild
  # (Q13).
  app-data:
  # The default for `WORKSPACE_DATA`: managed workspace roots, which are the users' own files.
  # Point that variable at a directory on your own storage and this volume goes unused — which is
  # the arrangement ADR-0003 is about, because files you cannot find without the app are not
  # really yours (10 § storage placement).
  workspace-data:

networks:
  internal:
    driver: bridge
  edge:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
  # Where extractors live, and the reason the privacy promise is a property of the deployment
  # rather than a hope about container code (ADR-0021). `internal: true` means no gateway: a
  # container here can reach the other members of this network and *nothing else* — not the
  # internet, not PostgreSQL (which is not a member), not the proxy.
  #
  # Requires Docker Engine >= 25.0.5. Before that, the embedded DNS forwarded lookups out of
  # internal networks (CVE-2024-29018), which is a data-exfiltration channel however isolated
  # the network looked. 28.x is recommended; it also drops unsolicited LAN traffic to
  # unpublished container ports.
  extractors:
    driver: bridge
    internal: true
